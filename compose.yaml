name: cmr621_monitoring

services:
  monitoring:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cmr621/omd-labs-monitoring:1.0
    container_name: cmr621-monitoring
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "10.7.99.103:8443:443"
    environment:
      ANSIBLE_DROPIN: /root/ansible_dropin
      ANSIBLE_VERBOSITY: "0"
      TZ: Europe/Kyiv
    volumes:
      - omd-sites:/omd/sites
      - ./bootstrap:/root/ansible_dropin:ro
    secrets:
      - omd_admin_password
      - snmp_community

volumes:
  omd-sites:

secrets:
  omd_admin_password:
    file: ${SECRETS_DIR:-./secrets}/omd_admin_password
  snmp_community:
    file: ${SECRETS_DIR:-./secrets}/snmp_community
