---
- name: Configure CMR621 monitoring
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    omd_site: demo
    monitoring_inventory: "{{ lookup('ansible.builtin.file', playbook_dir + '/inventory/devices.yml') | from_yaml }}"
    snmp_community: "{{ lookup('ansible.builtin.file', '/run/secrets/snmp_community') | trim }}"
  tasks:
    - name: Select Naemon as the monitoring core
      ansible.builtin.command:
        argv:
          - omd
          - config
          - "{{ omd_site }}"
          - set
          - CORE
          - naemon
      changed_when: false

    - name: Select Thruk as the default UI
      ansible.builtin.command:
        argv:
          - omd
          - config
          - "{{ omd_site }}"
          - set
          - DEFAULT_GUI
          - thruk
      changed_when: false

    - name: Stat the administrator password secret
      ansible.builtin.stat:
        path: /run/secrets/omd_admin_password
      register: admin_password_secret

    - name: Validate the administrator password secret
      ansible.builtin.assert:
        that:
          - admin_password_secret.stat.exists
          - admin_password_secret.stat.size > 0
        fail_msg: "Create secrets/omd_admin_password locally with one non-empty line before starting the container."

    - name: Locate the htpasswd binary
      ansible.builtin.shell:
        cmd: "command -v htpasswd || command -v htpasswd2 || true"
      register: htpasswd_binary
      changed_when: false

    - name: Stop if the htpasswd binary is missing
      ansible.builtin.assert:
        that:
          - htpasswd_binary.stdout | length > 0
        fail_msg: "htpasswd is not installed in the image. Run 'docker compose build' to rebuild the image with apache2-utils."

    - name: Stat the site htpasswd file
      ansible.builtin.stat:
        path: "/omd/sites/{{ omd_site }}/etc/htpasswd"
      register: site_htpasswd

    - name: Stop if the site htpasswd file is missing
      ansible.builtin.assert:
        that:
          - site_htpasswd.stat.exists
        fail_msg: "/omd/sites/{{ omd_site }}/etc/htpasswd is missing; the site etc volume is not initialized."

    - name: Set the administrator password from the Docker secret
      ansible.builtin.shell:
        cmd: |
          set -eu
          password="$(cat /run/secrets/omd_admin_password)"
          entry="$({{ htpasswd_binary.stdout }} -bnC 5 omdadmin "$password")"
          htpasswd_file="/omd/sites/{{ omd_site }}/etc/htpasswd"
          tmp_file="$(mktemp)"
          grep -v '^omdadmin:' "$htpasswd_file" > "$tmp_file" || true
          printf '%s\n' "$entry" >> "$tmp_file"
          install -o {{ omd_site }} -g {{ omd_site }} -m 0640 "$tmp_file" "$htpasswd_file"
          rm -f "$tmp_file"
        executable: /bin/bash
      changed_when: false
      no_log: true

    - name: Validate the SNMP community character set
      ansible.builtin.assert:
        that:
          - snmp_community is match('^[A-Za-z0-9_.-]+$')
        fail_msg: SNMP community must contain only letters, digits, periods, underscores, or hyphens.
      no_log: true

    - name: Store the SNMP community in the runtime-only Nagios resource file
      ansible.builtin.lineinfile:
        path: "/omd/sites/{{ omd_site }}/etc/naemon/resource.cfg"
        regexp: '^\$USER2\$='
        line: "$USER2$={{ snmp_community }}"
        owner: "{{ omd_site }}"
        group: "{{ omd_site }}"
        mode: "0600"
      no_log: true

    - name: Create persistent check_nwc_health state directory
      ansible.builtin.file:
        path: "/omd/sites/{{ omd_site }}/var/check_nwc_health"
        state: directory
        owner: "{{ omd_site }}"
        group: "{{ omd_site }}"
        mode: "0750"

    - name: Validate that enabled devices have addresses
      ansible.builtin.assert:
        that:
          - item.address is string
          - item.address | length > 0
          - item.kind in ['network', 'camera']
        fail_msg: "Enabled device {{ item.id }} needs a valid address and kind."
      loop: "{{ monitoring_inventory.devices | selectattr('enabled', 'equalto', true) | list }}"

    - name: Install host groups
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/nagios/hostgroups.cfg"
        dest: "/omd/sites/{{ omd_site }}/etc/naemon/conf.d/cmr621-hostgroups.cfg"
        owner: "{{ omd_site }}"
        group: "{{ omd_site }}"
        mode: "0644"

    - name: Install SNMP check command
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/nagios/commands.cfg"
        dest: "/omd/sites/{{ omd_site }}/etc/naemon/conf.d/cmr621-commands.cfg"
        owner: "{{ omd_site }}"
        group: "{{ omd_site }}"
        mode: "0644"

    - name: Render enabled device objects from the Git inventory
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/devices.cfg.j2"
        dest: "/omd/sites/{{ omd_site }}/etc/naemon/conf.d/cmr621-devices.cfg"
        owner: "{{ omd_site }}"
        group: "{{ omd_site }}"
        mode: "0644"
